# General
spring.application.name=authservice
server.port=8001

# Datasource
spring.datasource.url=jdbc:postgresql://localhost:5432/user_service_db
spring.datasource.username=postgres
spring.datasource.password=1234

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=${JWT_SECRET_KEY:io345oij345oij345oij34o5in345oin34oi5n3i45}
# 1 hour
jwt.expiration-ms=3600000

### OpenAPI

# Version
springdoc.api-docs.version=OPENAPI_3_1
# Set custom path of the OpenAPI documentation in Json format
springdoc.api-docs.path=/api-docs
# Disable the springdoc-openapi endpoint
springdoc.api-docs.enabled=true
# The list of packages to scan (comma separated)
springdoc.packages-to-scan=com.ecommerce.auth.controller
# The list of paths to match (comma separated)
springdoc.paths-to-match=/auth/**

### Swagger UI

# Set custom path of the swagger-ui HTML documentation
springdoc.swagger-ui.path=/swagger-ui.html
# Disable the swagger-ui endpoint
springdoc.swagger-ui.enabled=true
# Controls whether the "Try it out" section should be enabled by default
springdoc.swagger-ui.tryItOutEnabled=true